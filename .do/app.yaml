# App Spec — DigitalOcean App Platform
# 1) Ajuste `github.repo` e `region`.
# 2) Cadastre no painel da app (Runtime → Environment Variables) os secrets:
#    SEFAZ_BRIDGE_SECRET, CERT_ENCRYPTION_KEY, SPACES_KEY, SPACES_SECRET
#    Opcional: BRIDGE_HMAC_SECRET, ADMIN_CERT_OVERRIDE_SECRET
# Referência: https://docs.digitalocean.com/products/app-platform/reference/app-specification/

name: sefaz-bridge
region: nyc

services:
  - name: api
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: YOUR_GITHUB_ORG/sefaz-bridge
      branch: main
      deploy_on_push: true
    http_port: 3000
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /health
      initial_delay_seconds: 20
      period_seconds: 30
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    routes:
      - path: /
    envs:
      - key: PORT
        value: "3000"
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: STORAGE_DRIVER
        value: spaces
      - key: SPACES_PREFIX
        value: sefaz-bridge/production/
      - key: SEFAZ_HTTP_TIMEOUT_MS
        value: "90000"
      - key: SEFAZ_HTTP_MAX_RETRIES
        value: "2"
      - key: RATE_LIMIT_MAX
        value: "180"
      - key: RATE_LIMIT_CERT_MAX
        value: "30"
      - key: SPACES_BUCKET
        value: your-bridge-bucket
      - key: SPACES_REGION
        value: nyc3
      - key: SPACES_ENDPOINT
        value: https://nyc3.digitaloceanspaces.com
      - key: SEFAZ_DISTRIBUICAO_URL
        value: https://www1.nfe.fazenda.gov.br/NFeDistribuicaoDFe/NFeDistribuicaoDFe.asmx
